name: Build Gravity Test Game APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Command Line Tools & SDK
        run: |
          mkdir -p android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH

          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build and Sign APK
        run: |
          ANDROID_SDK_ROOT=$PWD/android-sdk
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-34"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          mkdir -p build/gen build/obj build/apk

          "$BUILD_TOOLS/aapt" package -f -m \
            -J build/gen \
            -M AndroidManifest.xml \
            -S res \
            -I "$PLATFORM/android.jar"

          javac -source 17 -target 17 \
            -bootclasspath "$PLATFORM/android.jar" \
            -d build/obj \
            build/gen/com/gravitystudios/testgame/R.java \
            src/com/gravitystudios/testgame/MainActivity.java

          "$BUILD_TOOLS/d8" --output build/apk $(find build/obj -name "*.class")

          "$BUILD_TOOLS/aapt" package -f \
            -M AndroidManifest.xml \
            -S res \
            -I "$PLATFORM/android.jar" \
            -F build/unsigned.apk

          cd build && "$BUILD_TOOLS/aapt" add unsigned.apk classes.dex && cd ..

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Gravity Studios,O=Gravity,C=LK"
          fi

          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out build/GravityTestGame.apk build/unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityTestGame-apk
          path: build/GravityTestGame.apk
